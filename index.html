<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Avaterra – Battle Royale Board Game</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<!-- ── Root layout ──────────────────────────────────────── -->
<div id="root">

  <!-- Phaser canvas goes here -->
  <div id="phaser-container"></div>

  <!-- Right panel (in-game HUD) -->
  <div id="right-panel" class="hidden">

    <!-- Top: round + current player -->
    <div class="panel-box" id="top-bar">
      <span id="round-indicator">Round 1</span>
      <span id="current-player-banner">—</span>
      <div id="removal-warning"></div>
      <div id="deck-counters" style="font-size:11px;color:#aaa;margin-top:4px;"></div>
    </div>

    <!-- Players status -->
    <div class="panel-box">
      <div id="player-list"></div>
    </div>

    <!-- Current player's combat hand -->
    <div class="panel-box" id="hand-display"></div>

    <!-- Current player's inventory -->
    <div class="panel-box" id="inventory-display"></div>

    <!-- Action buttons -->
    <div class="panel-box">
      <div id="action-bar"></div>
    </div>

    <!-- Game log -->
    <div class="panel-box" style="min-height:100px;max-height:220px;overflow-y:auto;">
      <div style="font-size:11px;color:var(--text-dim);margin-bottom:4px;">Game Log</div>
      <div id="game-log"></div>
    </div>

  </div><!-- /#right-panel -->
</div><!-- /#root -->

<!-- ── Multiplayer spectator bar ─────────────────────────── -->
<div id="mp-spectator-bar" style="display:none;"></div>

<!-- ── Tile tooltip ──────────────────────────────────────── -->
<div id="tile-tooltip" class="hidden"></div>

<!-- ── Toast ─────────────────────────────────────────────── -->
<div id="toast" class="toast"></div>

<!-- ── Character select overlay ──────────────────────────── -->
<div id="char-select" class="overlay">
  <div id="char-select-content"></div>
</div>

<!-- ── Combat overlay ────────────────────────────────────── -->
<div id="combat-overlay" class="hidden"></div>

<!-- ── General modal overlay ─────────────────────────────── -->
<div id="modal-overlay" class="hidden"></div>

<!-- ── Game over overlay ─────────────────────────────────── -->
<div id="gameover-overlay" class="hidden"></div>

<!-- ── God Mode Debug Panel ──────────────────────────────── -->
<div id="debug-panel" class="hidden">
  <div id="debug-header">
    🛠 God Mode
    <button id="debug-close" onclick="DebugPanel.toggle()">✕</button>
  </div>
  <div id="debug-body">
    <section>
      <h4>Spawn Item</h4>
      <select id="dbg-player-sel"></select>
      <select id="dbg-tier-sel">
        <option value="bronze">Bronze</option>
        <option value="silver">Silver</option>
        <option value="gold">Gold</option>
      </select>
      <button onclick="DebugPanel.spawnItem()">Spawn</button>
    </section>
    <section>
      <h4>Swap Terrain</h4>
      <select id="dbg-tile-sel"></select>
      <select id="dbg-terrain-sel"></select>
      <button onclick="DebugPanel.swapTerrain()">Swap</button>
    </section>
    <section>
      <h4>Trigger Ability</h4>
      <select id="dbg-ability-player"></select>
      <button onclick="DebugPanel.triggerAbility()">Trigger</button>
    </section>
    <section>
      <h4>Set HP / XP / AP</h4>
      <select id="dbg-stat-player"></select>
      <select id="dbg-stat-type">
        <option value="hp">HP</option>
        <option value="xp">XP</option>
        <option value="ap">AP</option>
      </select>
      <input id="dbg-stat-val" type="number" value="5" min="0" max="99" style="width:50px">
      <button onclick="DebugPanel.setStat()">Set</button>
    </section>
  </div>
</div>
<button id="debug-toggle-btn" onclick="DebugPanel.toggle()" title="God Mode">🛠</button>

<!-- ── Scripts ───────────────────────────────────────────── -->
<!-- Firebase (loaded before game code so Multiplayer.js can use it) -->
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

<!-- Phaser 3 -->
<script src="https://cdn.jsdelivr.net/npm/phaser@3.60.0/dist/phaser.min.js"></script>

<!-- Game code (order matters: data → state → scene → ui → main) -->
<script src="js/data.js"></script>
<script src="js/GameState.js"></script>
<script src="js/GameScene.js"></script>
<script src="js/firebase-config.js"></script>
<script src="js/Multiplayer.js"></script>
<script src="js/UIManager.js"></script>
<script src="js/DebugPanel.js"></script>
<script src="js/main.js"></script>

</body>
</html>
